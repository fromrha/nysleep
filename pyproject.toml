[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nythsleep"
version = "2.0.0"
description = "Cross-platform terminal power management"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Fromrha" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]

[project.scripts]
nythsleep = "nythsleep:main"
nsleep = "nythsleep:main"

[tool.setuptools]
py-modules = ["nythsleep", "platforms"]
package-dir = {"" = "src"}
